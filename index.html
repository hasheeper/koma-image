<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <script>
      // Paint the saved appearance before the first frame; src/app/theme.ts owns later changes.
      {
        let theme;
        try { theme = JSON.parse(localStorage.getItem("koma.theme.v1") || "null"); } catch {}
        document.documentElement.dataset.theme = theme === "light" ? "light"
          : theme === "system" && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
    </script>
    <meta name="robots" content="noindex">
    <title>Koma Image</title>
    <link rel="icon" id="workspaceIcon" type="image/svg+xml" href="/assets/favicon-image.svg">
    <link rel="preload" href="/fonts/koma-rounded/files/koma-rounded-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/fredoka/files/fredoka-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/index.css">
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/controls.css">
    <link rel="stylesheet" href="/styles/ui.css">
    <link rel="stylesheet" id="style-image" href="/styles/styles.css" media="not all">
    <link rel="stylesheet" id="style-chat" href="/styles/chat.css" media="not all">
    <link rel="stylesheet" id="style-tags" href="/styles/tags.css" media="not all">
    <link rel="stylesheet" href="/styles/editor.css">
    <link rel="stylesheet" href="/styles/settings.css">
    <link rel="stylesheet" href="/styles/transfer.css">
  </head>
  <body>
    <!-- Vue owns body children; no wrapper may break the original layout selectors. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
